{% set name = "pyraat" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 912a5d1f0eb24e936035625d5157c2b4fd013540377dd1369488de56acd1591e

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}

test:
  imports:
    - pyraat
  requires:
    - python {{ python_min }}
    - pip
    - pytest
  commands:
    - pip check

about:
  home: https://github.com/mmcauliffe/Pyraat
  summary: Interface for running Praat scripts through Python
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://pyraat.readthedocs.io/en/latest/
  dev_url: https://github.com/mmcauliffe/Pyraat

extra:
  recipe-maintainers:
    - lxy2304
    - mmcauliffe
